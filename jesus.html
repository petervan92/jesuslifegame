<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hành trình theo chân Chúa Giê-su · Walking with Jesus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#3b2f5c;--sun:#ffd35c;--coral:#ff8a6b;--leaf:#7ed6a5;--lav:#b9a6f5;--cream:#fff8e7;--paper:#fffdf6;--bgtext:#3b2f5c}
@media (prefers-color-scheme:dark){:root{--bgtext:#fff8e7}body{background:linear-gradient(#1e1b4b 0,#3b2f6e 60%,#5b4a8a 100%) fixed!important}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:"Nunito","Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:17px;line-height:1.55;color:var(--ink);background:linear-gradient(#bfeaff 0,#e9f9ff 55%,#fff3cf 100%) fixed}
h1,h2,h3{font-family:"Baloo 2","Nunito",system-ui,sans-serif;font-weight:800;line-height:1.15;margin:0}
p{margin:0 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
#app{max-width:1100px;margin:0 auto;padding:10px 12px 40px}
:focus-visible{outline:4px solid var(--lav);outline-offset:3px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink)}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 14px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);font-weight:800}
button.chip:active{transform:translateY(3px);box-shadow:none}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{display:none}
@media(min-width:640px){.lbl{display:inline}}
.lang{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;box-shadow:0 3px 0 var(--ink);background:var(--paper)}
.lang button{border:0;background:transparent;color:var(--ink);min-width:48px;min-height:44px;font-weight:800}
.lang button[aria-pressed=true]{background:var(--sun)}
.tl{flex:1 1 220px;min-width:190px}
.tlbar{display:flex;gap:5px}
.seg{flex:1;height:14px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;position:relative}
.seg b{position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--c)}
.seg.on{outline:3px solid var(--sun);outline-offset:2px}
.tl small{display:block;font-size:13px;margin-top:4px;font-weight:800;color:var(--bgtext)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:8px 26px;border:3px solid var(--ink);border-radius:999px;background:var(--sun);color:var(--ink);font-family:"Baloo 2","Nunito",system-ui,sans-serif;font-weight:800;font-size:21px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn.coral{background:var(--coral)}
.btn.leaf{background:var(--leaf)}
.btn.ghost{background:var(--paper)}
.btn.small{min-height:44px;font-size:16px;padding:6px 16px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}

/* scenes */
.scenebox{position:relative;aspect-ratio:16/9;overflow:hidden;background:#8fd3f4}
.scenebox svg{display:block;width:100%;height:100%}
.o{stroke:#3b2f5c;stroke-width:3;stroke-linejoin:round}
.bob{animation:bob 2.8s ease-in-out infinite}
.hands{animation:bob 3.4s ease-in-out infinite}
.drift{animation:drift 16s ease-in-out infinite alternate}
.spin{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse2{animation:breathe 3.2s ease-in-out infinite}
.tw{animation:twinkle 2.4s ease-in-out infinite}
.wave{animation:wave 5s ease-in-out infinite alternate}
.rain{animation:rain .7s linear infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes drift{to{transform:translateX(26px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.25}}
@keyframes twinkle{50%{opacity:.25}}
@keyframes wave{to{transform:translateX(60px)}}
@keyframes rain{to{transform:translate(-14px,40px)}}

/* home */
.home{overflow:hidden}
.home .head{padding:22px 20px 14px;text-align:center}
.home h1{font-size:clamp(30px,6vw,54px)}
.home .head p{margin:8px auto 0;max-width:34em}
.home .scenebox,.finish .scenebox{border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.homebody{padding:16px 20px 26px;text-align:center}
.homebody p{max-width:40em;margin-left:auto;margin-right:auto}
.homebody .btns{justify-content:center}
.finish{overflow:hidden}

/* stop */
.stop{display:grid;gap:16px}
@media(min-width:900px){.stop{grid-template-columns:1.3fr 1fr;align-items:start}}
.stage{position:relative;overflow:hidden}
.mini{position:absolute;top:10px;right:10px;width:84px;padding:0;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 4px 0 var(--ink);background:#8fd3f4;aspect-ratio:400/640}
.mini svg{display:block;width:100%;height:100%}
.panel{padding:18px 20px 24px}
.dots{display:flex;gap:6px;margin-bottom:12px}
.dots i{width:28px;height:10px;border-radius:9px;border:2px solid var(--ink);background:#fff}
.dots i.on{background:var(--leaf)}
.tag{display:inline-block;padding:2px 12px;border:2px solid var(--ink);border-radius:99px;background:var(--cream);font-size:14px;margin:0 6px 6px 0}
.panel h2{font-size:clamp(26px,4.2vw,34px);margin:4px 0 6px}
.when{font-size:15px;opacity:.9;margin-bottom:8px}
.story{font-size:19px;line-height:1.6}
.fact{font-size:19px;line-height:1.6}

/* games */
.targets{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.tg{width:84px;height:84px;font-size:46px;line-height:1;border:3px solid var(--ink);border-radius:24px;background:var(--cream);box-shadow:0 5px 0 var(--ink);position:relative;padding:0}
.tg:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tg.done{background:#d9f7e4;box-shadow:0 2px 0 var(--ink);animation:pop .4s}
.tg em{position:absolute;right:-6px;bottom:-6px;font-size:22px;font-style:normal}
.opts{display:grid;gap:12px;margin-top:14px}
.opt{text-align:left;padding:12px 18px;border:3px solid var(--ink);border-radius:20px;background:var(--cream);color:var(--ink);box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:18px;min-height:56px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.ok{background:#bff0cf}
.opt.bad{background:#ffd0c4;opacity:.7}
.msg{margin-top:14px;padding:10px 16px;border-radius:18px;border:3px solid var(--ink);background:#e8ffe9;font-weight:800}
.msg.warn{background:#fff0d1}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes wob{25%{transform:scale(1.5)}50%{transform:scale(.8)}}

/* maps */
.mapbox{position:relative;border:3px solid var(--ink);border-radius:22px;overflow:hidden;background:#8fd3f4;margin-top:12px}
.mapscroll{overflow:auto;max-height:var(--mh,52vh);-webkit-overflow-scrolling:touch}
.mapscroll svg{display:block;height:auto}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-size:24px;font-weight:800;box-shadow:0 3px 0 var(--ink);padding:0}
.mk{cursor:pointer}
.mk text{font:800 15px "Baloo 2","Nunito",sans-serif;fill:#3b2f5c;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.mk .ring{fill:none;stroke:#ff6b6b;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite;pointer-events:none}
.mk .ring.hintring{stroke:#2fbf71}
.mk.wrong .dot{transform-box:fill-box;transform-origin:center;animation:wob .5s}
.rg{font:800 21px "Baloo 2","Nunito",sans-serif;fill:#3b2f5c;opacity:.38;letter-spacing:2px;pointer-events:none}
@keyframes ping{0%{transform:scale(.7);opacity:1}100%{transform:scale(2.2);opacity:0}}
.travel{overflow:hidden}
.thead{padding:18px 20px 12px}
.thead h2{font-size:clamp(22px,4vw,32px)}
.tmap{aspect-ratio:5/4;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);background:#8fd3f4}
.tmap svg{display:block;width:100%;height:100%}
.travel .btns{padding:0 20px 22px;margin-top:14px;justify-content:center}

/* reward, stamps */
.reward{text-align:center}
.stamp{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--c,#ffd35c);border:3px solid var(--ink);outline:3px dashed var(--ink);outline-offset:4px;font-size:36px;box-shadow:0 4px 0 var(--ink)}
.stamp.big{width:120px;height:120px;font-size:62px;margin:8px auto 18px;animation:stampin .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampin{from{transform:scale(2.4) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.stars{font-size:44px;display:flex;justify-content:center;gap:6px;margin:8px 0}
.stars span{filter:grayscale(1);opacity:.3}
.stars span.on{filter:none;opacity:1;animation:pop .5s both}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px 6px;padding:10px 4px 14px}
.st{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 2px;border:0;background:transparent;color:var(--ink);text-align:center;font-size:13px;line-height:1.2}
.st small{font-weight:800}
.st.lock .stamp{filter:grayscale(1);opacity:.5;outline-color:#999;border-color:#999;box-shadow:none}

/* modal */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:12px;background:rgba(59,47,92,.6)}
.sheet{width:min(600px,100%);max-height:94vh;overflow:auto;padding:16px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead h2{font-size:26px}
.legend span{margin-right:12px;white-space:nowrap}
.cf{position:fixed;top:-40px;z-index:60;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ============ helpers ============ */
const INK='#3b2f5c';
const b=(vi,en)=>({vi,en});
let lang='vi';
const L=o=>o[lang]||o.vi;
const $=id=>document.getElementById(id);
const G=(x,y,s,inner)=>`<g transform="translate(${x},${y}) scale(${s})">${inner}</g>`;
const sh=(h,a)=>{const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,Math.round(v+a*(a<0?v:255-v))));return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')};
const WHO={
 jesus:{c:'#fff8ec',sash:'#d8503f',hr:'#6b4a2f',beard:'#6b4a2f',hs:3,sk:'#f2c29a',trim:'#e8c06a'},
 mary:{c:'#ff8fa8',scarf:'#6fa0ff',inner:'#fffdf6',veilTrim:1,sash:'#f6c453'},
 joseph:{c:'#b98558',hr:'#5a3a24',beard:'#5a3a24',staff:1,sash:'#6b4a2f',band:'#e8d3a8'},
 john:{c:'#c9a27a',hr:'#6b4a2f',beard:'#6b4a2f',hs:3,fur:1,staff:1,sash:'#6b4a2f'},
 peter:{c:'#e2b46c',hr:'#4a3326',beard:'#4a3326',hs:1,band:'#3f8f9f',sash:'#3f8f9f'},
 zacchaeus:{c:'#8e5bd6',sx:1.3,cap:'#d94f6b',beard:'#4a3326',hr:'#4a3326',trim:'#ffd35c',sash:'#ffd35c'},
 martha:{c:'#ff8a6b',scarf:'#fff3d6',apron:1,sash:'#c9573c'},
 mary2:{c:'#b9a6f5',scarf:'#fffdf6',flower:1,sash:'#8c76d8'},
 simeon:{c:'#9ad9ea',gray:1,hr:'#f2f2f2',beard:'#f2f2f2',hs:2,staff:1,sash:'#5aa6c0'},
 anna:{c:'#d8b4fe',scarf:'#fffdf6',gray:1,staff:1,veilTrim:1,sash:'#a77fe0'},
 elizabeth:{c:'#ffb38a',scarf:'#d8c4f5',veilTrim:1,sash:'#e48a5c'},
 widow:{c:'#6b5b95',scarf:'#4a3a6a',sad:1,sash:'#3d3160'}
};
const COL=['#ff8a6b','#7ed6a5','#b9a6f5','#ffd35c','#6ea8ff','#ff9ec4','#8fd9e8','#f4a261'];
const SK=['#f6c9a0','#e8b088','#d49a72','#f0bf94'];
const HR=['#4a3326','#2e2018','#7a5436','#1f1a2e'];

/* ============ art library ============ */
const E={
 cloud:(x,y,s=1,c='#fff')=>G(x,y,s,`<g class="drift"><ellipse rx="48" ry="16" fill="${c}"/><ellipse cx="-24" cy="-10" rx="24" ry="17" fill="${c}"/><ellipse cx="14" cy="-17" rx="28" ry="21" fill="${c}"/></g>`),
 sun:(x,y,r=34)=>G(x,y,1,`<g class="spin">${[...Array(10)].map((_,i)=>`<rect x="-4" y="${-r-22}" width="8" height="16" rx="4" fill="#ffd35c" transform="rotate(${i*36})"/>`).join('')}</g><circle r="${r}" fill="#ffd35c" stroke="#ffb703" stroke-width="4"/><circle cx="-10" cy="-4" r="3.5" fill="${INK}"/><circle cx="10" cy="-4" r="3.5" fill="${INK}"/><path d="M-10,8 Q0,18 10,8" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="-18" cy="6" r="4" fill="#ff9ea0" opacity=".6"/><circle cx="18" cy="6" r="4" fill="#ff9ea0" opacity=".6"/>`),
 moon:(x,y)=>G(x,y,1,`<path class="o" d="M0,-34 A34,34 0 1,0 34,0 A26,26 0 1,1 0,-34Z" fill="#fff6c4"/>`),
 star:(x,y,s=1,c='#ffd35c')=>G(x,y,s,`<g class="tw"><polygon class="o" points="0,-20 6,-6 22,-6 9,3 14,18 0,9 -14,18 -9,3 -22,-6 -6,-6" fill="${c}"/></g>`),
 emo:(x,y,ch,sz=40,cls='')=>`<text x="${x}" y="${y}" font-size="${sz}" text-anchor="middle"${cls?` class="${cls}"`:''}>${ch}</text>`,
 hills:(c1,c2)=>`<path class="o" d="M-10,300 Q150,214 300,290 T610,268 T810,300 V460 H-10Z" fill="${c1}"/><path class="o" d="M-10,356 Q200,306 400,352 T810,340 V460 H-10Z" fill="${c2}"/>`,
 ground:(c,y)=>`<path class="o" d="M-10,${y} Q200,${y-18} 400,${y} T810,${y} V460 H-10Z" fill="${c}"/>`,
 tree:(x,y,s=1,c='#6fcf97')=>G(x,y,s,`<rect class="o" x="-7" y="-44" width="14" height="46" rx="5" fill="#a9744f"/><g class="o" fill="${c}"><circle cx="-20" cy="-50" r="21"/><circle cx="20" cy="-50" r="21"/><circle cx="0" cy="-64" r="30"/></g>`),
 palm:(x,y,s=1)=>G(x,y,s,`<path d="M-4,0 Q10,-40 0,-84" stroke="#a9744f" stroke-width="10" fill="none" stroke-linecap="round"/>${[-165,-130,-95,-55,-20].map(a=>`<ellipse class="o" cx="30" cy="0" rx="32" ry="9" fill="#4fb477" transform="translate(0,-84) rotate(${a})"/>`).join('')}<circle cx="-4" cy="-80" r="6" fill="#a9744f"/>`),

 bush:(x,y,s=1,c='#7ed6a5')=>G(x,y,s,`<g class="o" fill="${c}"><circle cx="-16" cy="-12" r="14"/><circle cx="16" cy="-12" r="14"/><circle cx="0" cy="-20" r="17"/></g>`),
 rock:(x,y,s=1,c='#cfc2b0')=>G(x,y,s,`<path class="o" d="M-26,0 Q-28,-24 -8,-28 Q14,-34 26,-12 Q30,-2 24,0Z" fill="${c}"/>`),
 house:(x,y,s=1,c='#ffe0c2')=>G(x,y,s,`<rect class="o" x="6" y="-86" width="30" height="30" rx="4" fill="${c}"/><rect class="o" x="-42" y="-52" width="84" height="52" rx="5" fill="${c}"/><rect class="o" x="-48" y="-62" width="96" height="12" rx="5" fill="#e8c9a0"/><path class="o" d="M-30,0 V-24 Q-20,-38 -10,-24 V0Z" fill="#7a5a45"/><rect class="o" x="12" y="-40" width="18" height="18" rx="9" fill="#ffe8a3"/>`),
 temple:(x,y,s=1)=>G(x,y,s,`<rect class="o" x="-130" y="-18" width="260" height="18" rx="4" fill="#f4e4b8"/><rect class="o" x="-112" y="-36" width="224" height="18" rx="4" fill="#f1d98f"/><rect class="o" x="-95" y="-132" width="190" height="96" fill="#ffe9a8"/><path class="o" d="M-12,-36 V-78 Q0,-92 12,-78 V-36Z" fill="#8a5a3c"/>${[-72,-30,12,54].map((c,i)=>`<rect class="o" x="${c+(i>1?6:-6)}" y="-126" width="18" height="90" rx="5" fill="#fff6d6"/>`).join('')}<path class="o" d="M-112,-132 L0,-196 L112,-132Z" fill="#ffc857"/><circle class="o" cx="0" cy="-158" r="10" fill="#fff"/>`),
 wall:(x,y,s=1)=>G(x,y,s,`<rect class="o" x="-170" y="-78" width="340" height="78" fill="#ead2a8"/>${Array.from({length:9},(_,i)=>`<rect class="o" x="${-170+i*40}" y="-96" width="24" height="20" fill="#ead2a8"/>`).join('')}<rect class="o" x="-190" y="-124" width="44" height="124" fill="#e3c796"/><rect class="o" x="146" y="-124" width="44" height="124" fill="#e3c796"/><path class="o" d="M-34,0 V-46 Q0,-84 34,-46 V0Z" fill="#6d4c3a"/>`),
 arch:(x)=>`<g transform="translate(${x},330)"><path class="o" d="M-52,0 V-150 Q-52,-215 0,-215 Q52,-215 52,-150 V0Z" fill="#c9ecff"/><path d="M0,-215 V0 M-52,-110 H52" stroke="${INK}" stroke-width="3" fill="none"/></g>`,
 mountain:(x,y,s=1,c='#c8b6ff')=>G(x,y,s,`<path class="o" d="M-140,0 Q-40,-190 0,-220 Q40,-190 140,0Z" fill="${c}"/><path d="M-32,-168 L0,-220 L32,-172 Q16,-156 0,-172 Q-16,-156 -32,-168Z" fill="#fff"/>`),
 cross:(x,y,s=1)=>G(x,y,s,`<rect class="o" x="-6" y="-80" width="12" height="80" fill="#a9744f"/><rect class="o" x="-26" y="-62" width="52" height="12" fill="#a9744f"/>`),
 tomb:(x,y,s=1)=>G(x,y,s,`<path class="o" d="M-120,0 Q-112,-112 0,-122 Q112,-112 120,0Z" fill="#cfc2b0"/><path class="o pulse2" d="M-38,0 V-52 Q0,-84 38,-52 V0Z" fill="#fff6c4"/><circle class="o" cx="92" cy="-30" r="34" fill="#e5dccd"/>`),
 water:(y,c1='#6ec6f2',c2='#a6e0ff')=>`<path d="M0,${y} q50,-14 100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 V450 H0Z" fill="${c1}"/><g class="wave"><path d="M-100,${y+36} q50,-12 100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0" fill="none" stroke="${c2}" stroke-width="5" stroke-linecap="round"/></g><path d="M0,${y+84} q60,-12 120,0 t120,0 t120,0 t120,0 t120,0 t120,0 t120,0" fill="none" stroke="${c2}" stroke-width="4" stroke-linecap="round" opacity=".7"/>`,
 rain:()=>`<g class="rain" stroke="#d6e6ff" stroke-width="3" stroke-linecap="round" opacity=".8">${Array.from({length:22},(_,i)=>`<path d="M${i*40-20},${(i*53)%300+20} l-8,22"/>`).join('')}</g>`,
 glow:(x,y,r,c='#fff6c4')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity=".55" class="pulse2"/>`,

function dist(a,b2){
 const [la1,lo1]=PL[a].ll,[la2,lo2]=PL[b2].ll,R=6371,r=Math.PI/180;
 const dl=(la2-la1)*r,dg=(lo2-lo1)*r;
 const h=Math.sin(dl/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dg/2)**2;
 return Math.max(1,Math.round(2*R*Math.asin(Math.sqrt(h))));
}

  h+=`<path id="routebg" d="${d}" fill="none" stroke="${INK}" stroke-width="5" stroke-dasharray="1 12" stroke-linecap="round" opacity=".6"/><path id="route" d="${d}" fill="none" stroke="#ff6b6b" stroke-width="7" stroke-linecap="round" style="stroke-dasharray:${o.arrived?'none':'0 9999'}"/>`;
 }
 for(const id in PL){
  const p=PL[id],[x,y]=p.xy;
  const isCur=o.cur===id||(mode==='travel'&&o.to===id);
  const fill=mode==='quiz'?'#fff':isCur?'#ff6b6b':done.has(id)?'#ffb703':'#fff';
  const r=mode==='mini'?15:11;
  h+=`<g class="mk"${o.click?` data-act="pin" data-p="${id}" role="button" aria-label="${mode==='quiz'?'?':L(p.n)}"`:''}>`;
  if(isCur&&mode!=='quiz')h+=`<circle class="ring" cx="${x}" cy="${y}" r="${r}"/>`;
  h+=`<circle cx="${x}" cy="${y}" r="${r+8}" fill="transparent"/><circle class="dot" cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${INK}" stroke-width="3.5"/>`;
  if(mode!=='quiz'&&done.has(id)&&!isCur)h+=`<circle cx="${x}" cy="${y}" r="${r*.36}" fill="#fff" pointer-events="none"/>`;
  if(lab){
   const tx=p.a==='e'?x-15:p.a==='s'?x+15:x,ty=p.a==='m'?y+30:y+5,an=p.a==='e'?'end':p.a==='s'?'start':'middle';
   h+=`<text x="${tx}" y="${ty}" text-anchor="${an}">${L(p.n)}</text>`;
  }
  h+='</g>';
 }
 if(mode==='travel'){
  const [wx,wy]=PL[o.arrived?o.to:o.from].xy;
  h+=`<g id="walker" transform="translate(${wx},${wy})"><g transform="scale(.36)">${E.person(0,0,1,{who:'jesus'})}</g></g>`;
 }
 return h+'</svg>';
}

}

{id:'sea1',ch:2,place:'sea',ico:'⛵',ref:'5:1-11',
 title:b("Biển Ga-li-lê","The Sea of Galilee"),
 time:b("Một buổi sáng bên hồ (5:1-2)","One morning by the lake (5:1-2)"),
 story:b("Bạn đứng bên bờ hồ Ghê-nê-xa-rết, cũng gọi là Biển Ga-li-lê. Đám đông chen lại để nghe bạn dạy, nên bạn bước lên thuyền của Si-môn. Sau đó bạn bảo: «Hãy chèo ra khơi và thả lưới!» Lưới đầy cá đến mức gần rách! Si-môn, Gia-cơ và Giăng bỏ hết mọi thứ để đi theo bạn.","You stand by Lake Gennesaret, also called the Sea of Galilee. Crowds press in to hear you, so you step into Simon’s boat. Then you say, “Row out into the deep water and let down your nets!” The nets fill with so many fish they almost tear! Simon, James and John leave everything to follow you."),
 fact:b("Lu-ca gọi đây là «hồ» (5:1), vì thật ra nó là một hồ nước ngọt lớn. Gió có thể nổi lên rất nhanh vì hồ nằm giữa các ngọn đồi cao.","Luke calls it a “lake” (5:1), because it really is a large freshwater lake. Wind can rise very quickly there because the lake lies between tall hills."),
 g:{t:'tap',q:b("Chạm vào những chú cá để kéo đầy lưới.","Tap the fish to fill the net."),s:['🐟','🐟','🐟','🐟','🐟','🐟']},
 sc:()=>({sky:'dawn',els:[E.sun(690,100),E.cloud(180,70),E.water(262),E.person(204,300,.55,{who:'peter'}),E.boat(236,314,1.1),E.person(548,296,.5,{c:'#7ed6a5',beard:'#2e2018'}),E.person(636,298,.5,{c:'#ff9ec4',hr:'#2e2018'}),E.boat(590,310,.95),E.fish(390,352,1.2,'#ff9ec4'),E.fish(470,374,1,'#ffd35c'),E.fish(300,386,.9,'#8fd9e8'),E.fish(540,358,.9,'#ff8a6b'),E.fish(180,382,1,'#b9a6f5'),E.fish(660,388,1.1,'#7ed6a5')]})},

{id:'nain1',ch:2,place:'nain',ico:'🌅',ref:'7:11-17',
 title:b("Làng Na-in","The Town of Nain"),
 time:b("Ngay sau đó (7:11)","Soon after (7:11)"),
 story:b("Bạn cùng các môn đồ và đám đông đến cổng thành Na-in. Có một đám tang đi ra: người mẹ góa đang khóc vì đứa con trai duy nhất đã mất. Bạn thương bà lắm và nói: «Đừng khóc nữa.» Bạn chạm vào quan tài và nói: «Hỡi chàng trai, Ta bảo anh hãy dậy!» Chàng ngồi dậy và nói chuyện. Mọi người ca ngợi Đức Chúa Trời.","You and your disciples and a big crowd come to the gate of the town of Nain. A funeral is coming out: a widow is crying because her only son has died. Your heart goes out to her. You say, “Don’t cry.” You touch the stretcher and say, “Young man, I tell you, get up!” He sits up and starts to talk. Everyone praises God."),
 fact:b("Na-in là thị trấn nhỏ ở chân đồi, cách Na-xa-rét chừng 10 km. Lu-ca nhắc đến «cổng thành» (7:12), nơi dân làng thường gặp gỡ nhau.","Nain was a small town at the foot of a hill, about 10 km from Nazareth. Luke mentions the “town gate” (7:12), where villagers often met."),
 g:{t:'quiz',q:b("Khi thấy người mẹ khóc, bạn cảm thấy thế nào?","How did you feel when you saw the mother crying?"),o:[b("Thương xót bà","Full of compassion for her"),b("Giận dữ","Angry"),b("Không để ý","You did not notice")],a:0},
 sc:()=>({sky:'day',els:[E.sun(90,70),E.cloud(330,70),E.hills('#b9ecb0','#8fdca5'),E.wall(600,336,1.2),`<rect class="o" x="455" y="352" width="100" height="10" rx="4" fill="#a9744f"/>`,E.person(470,340,.7,{c:'#fffdf6',rot:90}),E.person(380,358,1.1,{who:'widow'}),crowd(90,342,5,60,.75,{k:2})]})},

{id:'gerasa1',ch:2,place:'gerasa',ico:'⛈️',ref:'8:22-39',
 title:b("Vượt hồ sang Ghê-ra-sa","Crossing to the Gerasenes"),
 time:b("Một ngày nọ (8:22)","One day (8:22)"),
 story:b("Bạn bảo các môn đồ: «Chúng ta sang bờ bên kia hồ nhé.» Giữa hồ, bạn ngủ thiếp đi thì bão nổi lên! Các môn đồ hoảng sợ đánh thức bạn. Bạn truyền cho gió và sóng: «Im đi!» và mọi sự yên lặng. Rồi thuyền cập bến vùng Ghê-ra-sa, nơi bạn giúp một người đau khổ được bình an trở lại.","You tell your disciples, “Let’s go over to the other side of the lake.” In the middle of the lake you fall asleep, and a storm rises! Your frightened disciples wake you. You tell the wind and waves, “Quiet!” and everything becomes calm. Then the boat lands in the region of the Gerasenes, where you help a suffering man find peace again."),
 fact:b("Ghê-ra-sa nằm ở bờ đông của hồ, đối diện miền Ga-li-lê. Đa số dân ở đó không phải người Do Thái, và họ nuôi heo (8:32).","The land of the Gerasenes lies on the east shore of the lake, across from Galilee. Most people there were not Jewish, and they kept herds of pigs (8:32)."),
 g:{t:'tap',q:b("Chạm vào các đám mây bão để làm trời quang.","Tap the storm clouds to clear the sky."),s:['⛈️>☀️','⛈️>☀️','⛈️>☀️']},
 sc:()=>({sky:'storm',els:[E.cloud(160,80,1.4,'#6f7a99'),E.cloud(520,60,1.6,'#7c86a8'),E.cloud(710,124,1,'#6f7a99'),E.emo(230,160,'⚡',48,'tw'),E.emo(610,150,'⚡',40,'tw'),E.water(292,'#4f86c6','#7fb0e8'),E.person(350,308,.6,{c:'#ff8a6b',sad:1}),E.person(450,306,.6,{c:'#7ed6a5',sad:1}),E.person(400,302,.55,{c:'#ffd35c',sad:1}),E.boat(400,324,1.5),E.rain()]})},

{id:'bethsaida1',ch:2,place:'bethsaida',ico:'🍞',ref:'9:10-17',
 title:b("Bết-xai-đa: Năm cái bánh","Bethsaida: Five Loaves"),
 time:b("Khi các sứ đồ trở về (9:10)","When the apostles returned (9:10)"),
 story:b("Bạn đưa các sứ đồ đến vùng Bết-xai-đa để nghỉ ngơi, nhưng đám đông tìm theo. Bạn đón tiếp họ, dạy dỗ và chữa bệnh. Chiều đến, chỉ có năm cái bánh và hai con cá. Bạn tạ ơn, bẻ bánh, và ai cũng được ăn no. Còn dư đến mười hai giỏ!","You take the apostles to the area of Bethsaida to rest, but the crowds follow. You welcome them, teach them and heal the sick. By evening there are only five loaves and two fish. You give thanks and break the bread, and everyone eats until they are full. Twelve baskets of food are left over!"),
 fact:b("Bết-xai-đa ở phía đông bắc của hồ Ga-li-lê. Lu-ca kể có khoảng 5.000 người nam. Đó là nơi vắng vẻ, xa nhà, nên ai cũng cần được cho ăn (9:12).","Bethsaida is on the northeast side of the Sea of Galilee. Luke says there were about 5,000 men. It was a quiet place far from home, so everyone needed food (9:12)."),
 g:{t:'tap',q:b("Chạm vào 5 cái bánh và 2 con cá để tạ ơn.","Tap the 5 loaves and 2 fish to give thanks."),s:['🍞','🍞','🍞','🍞','🍞','🐟','🐟']},
 sc:()=>({sky:'day',hold:'🍞',els:[E.sun(90,70),E.cloud(300,80),E.cloud(620,60,.8),E.hills('#b7ecab','#8fdca5'),crowd(40,324,11,70,.7,{arms:1}),crowd(80,348,9,76,.82,{k:3,f:1}),E.emo(160,402,'🧺',42),E.emo(650,406,'🧺',42),E.emo(720,394,'🐟',34)]})},

{id:'tabor1',ch:2,place:'tabor',ico:'✨',ref:'9:28-36',
 title:b("Núi biến hình","The Mountain of Transfiguration"),
 time:b("Khoảng tám ngày sau đó (9:28)","About eight days later (9:28)"),
 story:b("Bạn dẫn Phi-e-rơ, Gia-cơ và Giăng lên núi để cầu nguyện. Đang cầu nguyện, mặt bạn đổi khác và áo bạn trắng chói. Môi-se và Ê-li hiện ra trong ánh sáng, nói chuyện với bạn. Rồi có tiếng từ đám mây: «Đây là Con Ta, Người đã được chọn. Hãy nghe lời Người!»","You take Peter, James and John up a mountain to pray. While you pray, your face changes and your clothes shine brilliant white. Moses and Elijah appear in glorious light and talk with you. Then a voice comes from a cloud: “This is my Son, whom I have chosen. Listen to him!”"),
 fact:b("Lu-ca chỉ viết «một ngọn núi», không nêu tên. Theo truyền thống, nhiều người nghĩ đó là núi Ta-bô ở miền Ga-li-lê.","Luke only says “a mountain” and does not give its name. By tradition, many people think it was Mount Tabor in Galilee."),
 g:{t:'quiz',q:b("Ba môn đồ cùng lên núi với bạn là ai?","Which three disciples went up the mountain with you?"),o:[b("Phi-e-rơ, Gia-cơ và Giăng","Peter, James and John"),b("Ma-thi-ơ, Phi-líp và Tô-ma","Matthew, Philip and Thomas"),b("Mác-ta, Ma-ri-a và Da-kêu","Martha, Mary and Zacchaeus")],a:0},
 sc:()=>({sky:'bright',els:[E.ray(400,-10),E.cloud(130,90,1.2),E.cloud(680,80,1.2),E.mountain(400,352,1.55,'#c8b6ff'),E.glow(300,215,58),E.person(300,262,.75,{c:'#fffdf6',sk:'#fff0d6',hr:'#e6d9b8',beard:'#e6d9b8'}),E.glow(500,215,58),E.person(500,262,.75,{c:'#fffdf6',sk:'#fff0d6',hr:'#e6d9b8',beard:'#e6d9b8'}),E.person(120,384,.8,{who:'peter',sleep:1,rot:80}),E.person(200,392,.75,{c:'#6ea8ff',sleep:1,rot:80}),E.person(690,388,.8,{c:'#7ed6a5',sleep:1,rot:80}),E.emo(150,320,'💤',30,'bob'),E.emo(700,320,'💤',30,'bob')]})},

{id:'samaria1',ch:3,place:'samaria',ico:'🤝',ref:'9:51-56; 10:25-37',
 title:b("Sa-ma-ri: Người láng giềng nhân lành","Samaria: The Kind Neighbor"),
 time:b("Khi bạn quyết tâm đi lên Giê-ru-sa-lem (9:51)","When you set out for Jerusalem (9:51)"),
 story:b("Bạn quyết tâm đi lên Giê-ru-sa-lem và đi qua vùng Sa-ma-ri. Một làng không chịu đón tiếp bạn. Các môn đồ nổi giận, nhưng bạn nhẹ nhàng nhắc họ rồi đi sang làng khác. Trên đường, bạn kể một câu chuyện: một người Sa-ma-ri đã dừng lại giúp người bị thương, trong khi những người khác đi ngang qua.","You are determined to go up to Jerusalem, and you travel through Samaria. One village will not welcome you. Your disciples are angry, but you gently correct them and move on to another village. On the road you tell a story: a Samaritan stopped to help an injured man while others walked right past."),
 fact:b("Người Do Thái và người Sa-ma-ri thời đó thường không thân nhau. Vì thế, khi bạn chọn người Sa-ma-ri làm người tốt trong câu chuyện, ai cũng ngạc nhiên!","Jews and Samaritans in those days often did not get along. So when you made the Samaritan the hero of your story, everyone was surprised!"),
 g:{t:'quiz',q:b("Trong câu chuyện, ai đã dừng lại giúp người bị thương?","In the story, who stopped to help the injured man?"),o:[b("Người Sa-ma-ri","The Samaritan"),b("Thầy tế lễ","The priest"),b("Người Lê-vi","The Levite")],a:0},
 sc:()=>({sky:'day',els:[E.sun(90,70),E.cloud(300,80),E.hills('#d9eda0','#b7dc78'),E.house(110,324,1,'#ffe0c2'),E.house(214,336,.9,'#d9f0ff'),`<path d="M300,452 C330,392 430,384 420,344 C410,316 470,306 520,302 L545,302 C480,322 520,344 548,372 C566,398 610,424 650,452Z" fill="#f0d49b"/>`,E.donkey(660,350,1.1),E.person(490,354,1,{c:'#ffa94d',arms:'up'}),E.person(585,386,.85,{c:'#6ea8ff',rot:86,sad:1})]})},

{id:'bethany1',ch:3,place:'bethany',ico:'🧡',ref:'10:38-42',
 title:b("Bê-ta-ni: Nhà Mác-ta và Ma-ri-a","Bethany: Martha and Mary’s Home"),
 time:b("Trên đường đi (10:38)","On the way (10:38)"),
 story:b("Bạn vào một làng và được chị Mác-ta mời về nhà. Mác-ta bận rộn lo bữa ăn. Còn em gái chị, Ma-ri-a, ngồi dưới chân bạn để lắng nghe. Bạn nhẹ nhàng nói: «Mác-ta ơi, con lo lắng nhiều việc quá. Nhưng chỉ có một việc cần thiết. Ma-ri-a đã chọn phần tốt nhất.»","You enter a village and Martha invites you into her home. Martha is busy getting the meal ready. Her sister Mary sits at your feet and listens. You say gently, “Martha, you are worried about many things. But only one thing is needed. Mary has chosen what is better.”"),
 fact:b("Lu-ca không nêu tên làng. Phúc âm Giăng cho biết Mác-ta và Ma-ri-a sống ở Bê-ta-ni, gần Giê-ru-sa-lem (Giăng 11:1).","Luke does not name the village. The Gospel of John tells us that Martha and Mary lived in Bethany, near Jerusalem (John 11:1)."),
 g:{t:'quiz',q:b("Ma-ri-a đã chọn làm gì?","What did Mary choose to do?"),o:[b("Ngồi nghe bạn dạy","Sit and listen to you"),b("Nấu thật nhiều món ăn","Cook lots of food"),b("Đi ra chợ","Go to the market")],a:0},
 sc:()=>({sky:'day',els:[E.sun(700,70),E.cloud(300,80),E.hills('#b9ecb0','#8fdca5'),E.house(600,332,1.75,'#ffe0c2'),E.tree(60,340,1),E.person(150,354,1.1,{who:'martha',arms:'up'}),E.emo(150,236,'🍲',42,'bob'),E.person(250,380,.95,{who:'mary2'})]})},

{id:'jericho1',ch:3,place:'jericho',ico:'🌳',ref:'19:1-10',
 title:b("Giê-ri-cô: Da-kêu trên cây","Jericho: Zacchaeus in the Tree"),
 time:b("Khi bạn đi qua thành (19:1)","As you passed through the city (19:1)"),
 story:b("Bạn đi qua Giê-ri-cô, đường phố đông nghẹt người. Có một người thấp bé tên Da-kêu, làm chủ thu thuế. Ông trèo lên cây sung để nhìn bạn! Bạn ngước lên và gọi: «Da-kêu, xuống mau đi! Hôm nay Ta sẽ ở nhà con.» Da-kêu vui mừng, hứa giúp người nghèo và trả lại gấp bốn lần cho ai ông đã lấy lầm.","You walk through Jericho, and the streets are packed. A short man named Zacchaeus, a chief tax collector, climbs a sycamore tree to see you! You look up and call, “Zacchaeus, come down at once! Today I must stay at your house.” Zacchaeus is full of joy. He promises to help the poor and pay back four times as much to anyone he cheated."),
 fact:b("Giê-ri-cô là một trong những thành cổ nhất thế giới, nằm trong thung lũng thấp, có nhiều cây cọ và nước. Từ đây đường lên Giê-ru-sa-lem dốc cao khoảng 1.000 mét!","Jericho is one of the oldest cities in the world. It lies in a low valley with palm trees and water. From here the road climbs about 1,000 meters up to Jerusalem!"),
 g:{t:'map',q:b("Giê-ri-cô nằm gần sông Giô-đanh, trên đường lên Giê-ru-sa-lem. Hãy tìm Giê-ri-cô!","Jericho is near the Jordan River, on the road up to Jerusalem. Find Jericho!"),a:'jericho'},
 sc:()=>({sky:'day',els:[E.sun(700,70),E.cloud(200,70),E.hills('#b9ecb0','#8fdca5'),E.palm(70,338,1.2),E.palm(140,342,1),E.house(660,324,1,'#ffe9c9'),E.house(760,340,.9,'#d9f0ff'),E.tree(330,360,2.2,'#6fcf97'),E.person(330,238,.5,{who:'zacchaeus',arms:'up'}),crowd(470,344,3,60,.75,{arms:1})]})},

{id:'olives1',ch:3,place:'olives',ico:'🫒',ref:'19:28-44',
 title:b("Núi Ô-liu: Vào thành","The Mount of Olives: Entering the City"),
 time:b("Gần đến Giê-ru-sa-lem (19:29)","Near Jerusalem (19:29)"),
 story:b("Gần đến Bê-ta-ni, bạn nhờ hai môn đồ đi dắt về một chú lừa con chưa ai cưỡi. Bạn cưỡi lừa con đi xuống Núi Ô-liu. Dân chúng trải áo choàng trên đường và hát: «Chúc tụng Vua nhân danh Chúa! Bình an ở trên trời!»","Near Bethany you ask two disciples to bring you a young donkey that no one has ever ridden. You ride it down the Mount of Olives. The people spread their cloaks on the road and sing, “Blessed is the king who comes in the name of the Lord! Peace in heaven!”"),
 fact:b("Từ Núi Ô-liu, bạn nhìn thấy cả thành Giê-ru-sa-lem và đền thờ ở bên kia thung lũng.","From the Mount of Olives you can see all of Jerusalem and the Temple across the valley."),
 g:{t:'tap',q:b("Chạm để trải áo choàng trên đường.","Tap to spread cloaks on the road."),s:['🧥','🧥','🧥','🧥']},

{id:'gethsemane1',ch:4,place:'olives',ico:'🙏',ref:'22:39-46',
 title:b("Núi Ô-liu: Đêm cầu nguyện","The Mount of Olives: A Night of Prayer"),
 time:b("Đêm sau bữa tối Vượt Qua (22:14, 22:39)","The night after the Passover supper (22:14, 22:39)"),
 story:b("Sau bữa tối Vượt Qua với các môn đồ, bạn đến Núi Ô-liu để cầu nguyện. Đêm tối, bạn quỳ xuống thưa với Cha: «Xin cho ý Cha được nên.» Một thiên sứ từ trời đến giúp bạn thêm sức. Khi bạn đứng dậy, các môn đồ đang ngủ vì quá buồn.","After the Passover supper with your disciples, you go to the Mount of Olives to pray. In the dark you kneel and say to your Father, “May your will be done.” An angel from heaven comes to give you strength. When you get up, your disciples are asleep, worn out with sadness."),
 fact:b("Lu-ca chỉ nói «Núi Ô-liu». Các sách Ma-thi-ơ và Mác gọi nơi này là Ghết-sê-ma-ni, nghĩa là «nơi ép dầu ô-liu».","Luke only says “the Mount of Olives.” Matthew and Mark call the place Gethsemane, which means “olive press.”"),
 g:{t:'tap',q:b("Chạm vào thiên sứ để nhận thêm sức mạnh.","Tap the angel to receive strength."),s:['👼']},
 sc:()=>({sky:'night',els:[E.moon(690,86),E.hills('#4b7f8f','#3d6b80'),E.olive(130,346,1.5,'#6fa8a0'),E.olive(690,336,1.7,'#6fa8a0'),E.angel(400,320,1),E.person(190,386,.8,{c:'#ff8a6b',sleep:1,rot:82}),E.person(250,394,.75,{c:'#6ea8ff',sleep:1,rot:82}),E.person(560,390,.8,{c:'#7ed6a5',sleep:1,rot:82})]})},

/* ============ state + storage (localStorage, memory fallback) ============ */
const KEY='luke-journey-v1',memStore={};
const store={
 get(){try{const v=window.localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}return memStore.v||null},
 set(v){memStore.v=v;try{window.localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
};
let S={lang:null,cur:0,done:{}};
const save=()=>store.set(S);
const ui={screen:'home',modal:null,stopIdx:0,step:0,tapped:[],wrong:[],mistakes:0,gameDone:false,order:[],zoom:1.5,stars:3,from:null,travelP:0,travelDone:false,praise:0};
const totalStars=()=>Object.values(S.done).reduce((a,v)=>a+v,0);
const chProg=i=>{const a=STOPS.filter(s=>s.ch===i);return Math.round(a.filter(s=>S.done[s.id]).length/a.length*100)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const curPlace=()=>(ui.screen==='stop'||ui.screen==='travel')?STOPS[ui.stopIdx].place:STOPS[Math.min(S.cur,STOPS.length-1)].place;
const speechOK=typeof window!=='undefined'&&'speechSynthesis' in window;
const stopSpeech=()=>{if(speechOK)speechSynthesis.cancel()};
const reduceMotion=()=>typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ rendering ============ */
function langSw(){
 return `<div class="lang" role="group" aria-label="Language"><button data-act="lang" data-v="vi" aria-pressed="${lang==='vi'}">VI</button><button data-act="lang" data-v="en" aria-pressed="${lang==='en'}">EN</button></div>`;
}
function renderTop(){
 const home=ui.screen==='home';
 const c=home?0:STOPS[ui.stopIdx].ch;
 let h='<header class="bar">';
 if(!home){
  h+=`<button class="chip" data-act="home" aria-label="${T('home')}">🏠</button><div class="tl"><div class="tlbar">${CH.map((x,i)=>`<span class="seg${i===c?' on':''}" style="--c:${x.col};--p:${chProg(i)}%"><b></b></span>`).join('')}</div><small>${T('chapter')} ${c+1}: ${L(CH[c])}</small></div>`;
 }
 h+='<div class="tools">';
 if(!home)h+=`<span class="chip">⭐ ${totalStars()}</span><button class="chip" data-act="modal" data-m="map">🗺️<span class="lbl">${T('map')}</span></button>`;
 h+=`<button class="chip" data-act="modal" data-m="journal">📒<span class="lbl">${T('journal')}</span></button>${langSw()}</div></header>`;
 $('top').innerHTML=h;
}
function homeHTML(){
 const done=Object.keys(S.done).length,n=STOPS.length;
 let btns;
 if(S.cur>=n)btns=`<button class="btn" data-act="modal" data-m="journal">📒 ${T('journal')}</button><button class="btn ghost" data-act="restart">↺ ${T('again')}</button>`;
 else if(done===0&&S.cur===0)btns=`<button class="btn coral" data-act="start">▶ ${T('start')}</button>`;
 else btns=`<button class="btn coral" data-act="cont">▶ ${T('cont')}</button><button class="btn ghost" data-act="restart">↺ ${T('again')}</button>`;
 const prog=done?`<p class="when">⭐ ${totalStars()} &nbsp; 📍 ${done}/${n}</p>`:'';
 return `<main class="home card"><div class="head"><h1>${T('title')}</h1><p>${T('sub')}</p></div><div class="scenebox">${sceneSVG(HOME)}</div><div class="homebody"><p>${T('intro').replace('{n}',n)}</p>${prog}<div class="btns">${btns}</div></div></main>`;
}
function finishHTML(){
 return `<main class="finish card"><div class="scenebox">${sceneSVG(FIN)}</div><div class="homebody"><h1>🎉 ${T('fin1')}</h1><p>${T('fin2').replace('{n}',STOPS.length).replace('{s}',totalStars())}</p><div class="btns"><button class="btn" data-act="modal" data-m="journal">📒 ${T('journal')}</button><button class="btn ghost" data-act="restart">↺ ${T('again')}</button></div></div></main>`;
}
function stopHTML(){
 const st=STOPS[ui.stopIdx];
 return `<main class="stop"><section class="stage card"><div class="scenebox" role="img" aria-label="${L(st.title)}">${sceneSVG(st.sc())}</div><button class="mini" data-act="modal" data-m="map" aria-label="${T('map')}">${mapSVG({mode:'mini',vb:MINI_VB,cur:st.place})}</button></section><section class="panel card" id="panel"></section></main>`;
}
function travelHTML(){
 const to=STOPS[ui.stopIdx],A=PL[ui.from],B=PL[to.place],km=dist(ui.from,to.place);
 return `<main class="travel card"><div class="thead"><h2>🚶 ${L(A.n)} ➜ ${L(B.n)}</h2><p>📏 ≈ ${km} km ${T('crow')}, ${walkText(km)}</p></div><div class="tmap">${mapSVG({mode:'travel',vb:vbFor(ui.from,to.place),from:ui.from,to:to.place,arrived:ui.travelDone})}</div><div class="btns"><button id="goBtn" class="btn ${ui.travelDone?'coral':'ghost'}" data-act="arrive">${ui.travelDone?T('arrive')+' 🌟':T('skip')+' ⏩'}</button></div></main>`;
}
function renderScreen(){
 const s=$('screen');
 cancelAnimationFrame(raf);
 if(ui.screen==='home')s.innerHTML=homeHTML();
 else if(ui.screen==='finish')s.innerHTML=finishHTML();
 else if(ui.screen==='travel'){s.innerHTML=travelHTML();if(!ui.travelDone)runTravel()}
 else{s.innerHTML=stopHTML();renderPanel()}
}
function panelHTML(){
 const st=STOPS[ui.stopIdx],pl=PL[st.place];
 const dots=`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i<=ui.step?'on':''}"></i>`).join('')}</div>`;
 const nextBtn=`<button class="btn" data-act="next">${T('next')} ▶</button>`;
 if(ui.step===0)return dots+`<span class="tag" style="background:${CH[st.ch].col}">${T('chapter')} ${st.ch+1}</span><span class="tag">📖 ${T('lk')} ${st.ref}</span><h2>${L(st.title)}</h2><div class="when">🕰️ ${L(st.time)}</div><p class="story" id="txt">${L(st.story)}</p><div class="btns">${speechOK?`<button class="btn ghost" data-act="listen">🔊 ${T('listen')}</button>`:''}${nextBtn}</div>`;
 if(ui.step===1)return dots+`<h2>💡 ${T('fact')}</h2><div class="when">📍 ${L(pl.n)}</div><p class="fact" id="txt">${L(st.fact)}</p><div class="btns">${speechOK?`<button class="btn ghost" data-act="listen">🔊 ${T('listen')}</button>`:''}${nextBtn}</div>`;
 if(ui.step===2)return dots+gameHTML(st);
 return dots+rewardHTML(st);
}
function gameHTML(st){
 const g=st.g;
 let h=`<h2>🎮 ${T('play')}</h2><p class="story">${L(g.q)}</p>`;
 if(g.t==='tap'){
  h+=`<div class="targets">${g.s.map((t,i)=>{const [a,c]=t.split('>'),d=ui.tapped.includes(i);return `<button class="tg${d?' done':''}" data-act="tap" data-i="${i}"${d?' disabled':''}>${d?(c||a):a}${d&&!c?'<em>✓</em>':''}</button>`}).join('')}</div>`;
 }else if(g.t==='quiz'){
  if(!ui.order.length)ui.order=shuffle(g.o.map((_,i)=>i));
  h+=`<div class="opts">${ui.order.map(i=>{const bad=ui.wrong.includes(i),ok=ui.gameDone&&i===g.a;return `<button class="opt${ok?' ok':''}${bad?' bad':''}" data-act="ans" data-i="${i}"${ui.gameDone||bad?' disabled':''}>${L(g.o[i])}</button>`}).join('')}</div>`;
 }else{
  h+=mapBox({mode:ui.gameDone?'reveal':'quiz',vb:QUIZ_VB,click:!ui.gameDone,cur:ui.gameDone?g.a:null,zoom:ui.zoom,h:'46vh'})+`<div id="mapmsg" class="msg warn" hidden></div>`;
 }
 if(ui.gameDone)h+=`<div class="msg">🎉 ${L(U.praise[ui.praise])}</div><div class="btns"><button class="btn coral" data-act="toreward">${T('next')} ▶</button></div>`;
 else if(g.t==='quiz'&&ui.wrong.length)h+=`<div class="msg warn">${T('tryagain')}</div>`;
 return h;
}
function rewardHTML(st){
 const nx=STOPS[S.cur],last=!nx;
 return `<div class="reward"><div class="stamp big" style="--c:${CH[st.ch].col}"><span>${st.ico}</span></div><h2>${T('got')}</h2><p class="story">${L(st.title)}</p><div class="stars">${[1,2,3].map(i=>`<span class="${i<=ui.stars?'on':''}" style="animation-delay:${i*.18}s">⭐</span>`).join('')}</div>${last?'':`<div class="when">➡️ ${L(PL[nx.place].n)}</div>`}<div class="btns" style="justify-content:center"><button class="btn coral" data-act="go">${last?'🎉 '+T('finishBtn'):T('nextStop')+' ▶'}</button></div></div>`;
}
function renderPanel(){
 const p=$('panel');if(!p)return;
 p.innerHTML=panelHTML();
 const st=STOPS[ui.stopIdx];
 if(ui.step===2&&st.g.t==='map'&&!ui.gameDone)centerMap(290,420,QUIZ_VB);
}
function centerMap(x,y,vb){
 const sc=$('mscroll');if(!sc)return;
 const [vx,vy,vw,vh]=vb.split(' ').map(Number);
 sc.scrollLeft=(x-vx)/vw*sc.scrollWidth-sc.clientWidth/2;
 sc.scrollTop=(y-vy)/vh*sc.scrollHeight-sc.clientHeight/2;
}
function zoomMap(d){
 const sc=$('mscroll');if(!sc)return;
 const svg=sc.querySelector('svg');
 const cx=(sc.scrollLeft+sc.clientWidth/2)/sc.scrollWidth,cy=(sc.scrollTop+sc.clientHeight/2)/sc.scrollHeight;
 ui.zoom=Math.min(3,Math.max(1,ui.zoom+d*.5));
 svg.style.width=ui.zoom*100+'%';
 sc.scrollLeft=cx*sc.scrollWidth-sc.clientWidth/2;
 sc.scrollTop=cy*sc.scrollHeight-sc.clientHeight/2;
}
function renderModal(){
 const m=$('modal');
 if(!ui.modal){m.innerHTML='';return}
 let inner='';
 if(ui.modal==='map'){
  inner=`<div class="shead"><h2>🗺️ ${T('map')}</h2><button class="chip" data-act="close" aria-label="${T('close')}">✖</button></div>${mapBox({mode:'big',cur:curPlace(),click:true,zoom:ui.zoom,h:'58vh'})}<div id="pininfo" class="msg"><div class="legend"><span>🔴 ${T('here')}</span><span>🟡 ${T('been')}</span><span>⚪ ${T('notyet')}</span></div><div>${T('pickHint')} ${T('notScale')}</div></div>`;
 }else if(ui.modal==='journal'){
  inner=`<div class="shead"><h2>📒 ${T('journal')}</h2><button class="chip" data-act="close" aria-label="${T('close')}">✖</button></div><p class="when">⭐ ${totalStars()} &nbsp; 📍 ${Object.keys(S.done).length}/${STOPS.length}</p><div class="jgrid">${STOPS.map((s,i)=>{const d=S.done[s.id];return `<button class="st${d?'':' lock'}" data-act="replay" data-i="${i}"${d?'':' disabled'} style="--c:${CH[s.ch].col}"><span class="stamp"><span>${d?s.ico:'?'}</span></span><small>${d?L(s.title):'???'}</small><span>${d?'⭐'.repeat(d):''}</span></button>`}).join('')}</div>`;
 }else{
  inner=`<h2>${T('sure')}</h2><div class="btns"><button class="btn coral" data-act="yes">${T('yes')}</button><button class="btn ghost" data-act="no">${T('no')}</button></div>`;
 }
 m.innerHTML=`<div class="modal"><div class="sheet card" role="dialog" aria-modal="true">${inner}</div></div>`;
 if(ui.modal==='map'){const [x,y]=PL[curPlace()].xy;centerMap(x,y,VB_FULL)}
 const cb=m.querySelector('[data-act=close],[data-act=no]');if(cb)cb.focus();
}
function showPin(id){
 const p=PL[id];
 const btns=STOPS.map((s,i)=>[s,i]).filter(([s])=>s.place===id&&S.done[s.id]).map(([s,i])=>`<button class="btn ghost small" data-act="replay" data-i="${i}">🔁 ${L(s.title)}</button>`).join('');
 $('pininfo').innerHTML=`<strong>📍 ${L(p.n)}</strong>${btns?`<div class="btns" style="margin-top:8px">${btns}</div>`:`<div>${T('notyet2')}</div>`}`;
}
function render(){renderTop();renderScreen();renderModal()}

/* ============ game logic ============ */
let raf=0;
const TD=2600;
function startStop(i,from){
 stopSpeech();
 Object.assign(ui,{stopIdx:i,step:0,tapped:[],wrong:[],mistakes:0,gameDone:false,order:[],zoom:1.5,praise:Math.floor(Math.random()*4),modal:null});
 if(from&&from!==STOPS[i].place){ui.screen='travel';ui.from=from;ui.travelP=0;ui.travelDone=false}
 else ui.screen='stop';
 render();
}
function runTravel(){
 cancelAnimationFrame(raf);
 const path=$('routebg'),pr=$('route'),w=$('walker');
 if(!path||!pr||!w)return;
 const len=path.getTotalLength(),t0=performance.now()-ui.travelP*TD,red=reduceMotion();
 const tick=now=>{
  const p=red?1:Math.min(1,(now-t0)/TD);
  ui.travelP=p;
  const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,pt=path.getPointAtLength(len*e);
  w.setAttribute('transform',`translate(${pt.x},${pt.y})`);
  pr.style.strokeDasharray=`${len*e} ${len+50}`;
  if(p<1)raf=requestAnimationFrame(tick);
  else{ui.travelDone=true;const gb=$('goBtn');if(gb){gb.className='btn coral';gb.textContent=T('arrive')+' 🌟'}}
 };
 raf=requestAnimationFrame(tick);
}
function tapTarget(i){
 if(ui.tapped.includes(i))return;
 ui.tapped.push(i);
 if(ui.tapped.length>=STOPS[ui.stopIdx].g.s.length)ui.gameDone=true;
 renderPanel();
}
function answer(i){
 const g=STOPS[ui.stopIdx].g;
 if(i===g.a)ui.gameDone=true;else{ui.wrong.push(i);ui.mistakes++}
 renderPanel();
}
function pin(id){
 if(ui.modal==='map'){showPin(id);return}
 const st=STOPS[ui.stopIdx];
 if(ui.screen!=='stop'||ui.step!==2||st.g.t!=='map'||ui.gameDone)return;
 if(id===st.g.a){ui.gameDone=true;renderPanel();return}
 ui.mistakes++;ui.wrong.push(id);
 const m=$('mapmsg');m.hidden=false;m.textContent=`${T('thatis')} ${L(PL[id].n)}. ${T('tryagain')}`;
 const el=document.querySelector(`.mk[data-p="${id}"]`);
 if(el){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),600)}
 if(ui.wrong.length>=2){
  const t=document.querySelector(`.mk[data-p="${st.g.a}"]`);
  if(t&&!t.querySelector('.hintring')){
   const d=t.querySelector('.dot'),c=document.createElementNS('http://www.w3.org/2000/svg','circle');
   c.setAttribute('class','ring hintring');c.setAttribute('cx',d.getAttribute('cx'));c.setAttribute('cy',d.getAttribute('cy'));c.setAttribute('r',d.getAttribute('r'));
   t.insertBefore(c,t.firstChild);
  }
 }
}
function toReward(){
 const st=STOPS[ui.stopIdx];
 ui.stars=ui.mistakes===0?3:ui.mistakes===1?2:1;
 S.done[st.id]=Math.max(S.done[st.id]||0,ui.stars);
 if(ui.stopIdx===S.cur)S.cur++;
 save();
 ui.step=3;
 renderTop();renderPanel();confetti();
}
function goNext(){
 if(S.cur>=STOPS.length){ui.screen='finish';render();return}
 startStop(S.cur,STOPS[S.cur-1].place);
}
function confetti(){
 if(reduceMotion())return;
 const em=['⭐','✨','🎉','💛','🌈','🕊️'];
 for(let i=0;i<30;i++){
  const s=document.createElement('span');
  s.className='cf';s.textContent=em[i%em.length];
  s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.6+'s';s.style.fontSize=18+Math.random()*20+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),3300);
 }
}
function listen(){
 if(!speechOK)return;
 if(speechSynthesis.speaking){speechSynthesis.cancel();return}
 const el=$('txt');if(!el)return;
 const u=new SpeechSynthesisUtterance(el.textContent);
 u.lang=lang==='vi'?'vi-VN':'en-US';u.rate=.92;
 speechSynthesis.speak(u);
}

/* ============ events ============ */
function onClick(e){
 if(e.target.classList&&e.target.classList.contains('modal')){ui.modal=null;renderModal();return}
 const t=e.target.closest('[data-act]');if(!t)return;
 const d=t.dataset;
 switch(d.act){
  case 'start':startStop(0,null);break;
  case 'cont':startStop(S.cur,S.cur>0?STOPS[S.cur-1].place:null);break;
  case 'restart':ui.modal='confirm';renderModal();break;
  case 'yes':S={lang,cur:0,done:{}};save();ui.modal=null;ui.screen='home';render();break;
  case 'home':stopSpeech();ui.screen='home';ui.modal=null;render();break;
  case 'lang':lang=d.v;S.lang=lang;save();document.documentElement.lang=lang;stopSpeech();render();break;
  case 'modal':ui.modal=d.m;ui.zoom=1.5;renderModal();break;
  case 'close':case 'no':ui.modal=null;renderModal();break;
  case 'next':stopSpeech();ui.step++;renderPanel();break;
  case 'tap':tapTarget(+d.i);break;
  case 'ans':answer(+d.i);break;
  case 'pin':pin(d.p);break;
  case 'zoom':zoomMap(+d.d);break;
  case 'arrive':cancelAnimationFrame(raf);ui.screen='stop';render();break;
  case 'toreward':toReward();break;
  case 'go':goNext();break;
  case 'replay':ui.modal=null;startStop(+d.i,null);break;
  case 'listen':listen();break;
 }
}

/* ============ start ============ */
function init(){
 const v=store.get();
 if(v)S=Object.assign(S,v);
 const nav=(typeof navigator!=='undefined'&&navigator.language)||'vi';
 lang=S.lang||(nav.toLowerCase().startsWith('vi')?'vi':'en');
 document.documentElement.lang=lang;
 const app=$('app');
 app.innerHTML='<div id="top"></div><div id="screen"></div><div id="modal"></div>';
 app.addEventListener('click',onClick);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;renderModal()}});
 render();
}
if(typeof document!=='undefined'&&document.getElementById('app'))init();
</script>
</body>
</html>
